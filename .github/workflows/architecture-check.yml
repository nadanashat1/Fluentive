name: Architecture Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  architecture-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: 🔒 DDD Architecture Validation
      run: npm run architecture:check
      
    - name: 📋 ESLint Check
      run: npm run lint -- --max-warnings=0
      
    - name: 🏗️ TypeScript Check
      run: npm run typecheck
      
    - name: 🚨 Build Test
      run: npm run build
      
    - name: 📊 Architecture Report
      if: failure()
      run: |
        echo "🚨 ARCHITECTURE VIOLATION DETECTED"
        echo "Please fix DDD boundary violations before merging"
        echo "Run 'npm run architecture:check' locally to see details"
