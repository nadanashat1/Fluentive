<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burst Test - 50 Concurrent Requests</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #00ff00; }
        .test { margin: 20px 0; padding: 10px; border: 1px solid #333; }
        .pass { color: #00ff00; }
        .fail { color: #ff0000; }
        .info { color: #ffff00; }
        .warning { color: #ff9900; }
        pre { background: #000; padding: 10px; overflow-x: auto; }
        .burst { background: #2a0000; border-color: #ff0000; }
        .metric { background: #001a00; border-color: #00ff00; }
    </style>
</head>
<body>
    <h1>🔥 Burst Test - 50 Concurrent Requests</h1>
    <div id="results"></div>

    <script type="module">
        const results = document.getElementById('results');
        
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test ${type}`;
            div.innerHTML = `<pre>${message}</pre>`;
            results.appendChild(div);
        }

        // Monitor memory usage and Map size
        function getMemoryStats() {
            if (performance.memory) {
                return {
                    used: Math.round(performance.memory.usedJSHeapSize / 1024 / 1024),
                    total: Math.round(performance.memory.totalJSHeapSize / 1024 / 1024),
                    limit: Math.round(performance.memory.jsHeapSizeLimit / 1024 / 1024)
                };
            }
            return null;
        }

        // Test 1: Burst Test - 50 concurrent requests
        async function testBurstRequests() {
            log('🔥 Test 1: Burst Test - 50 Concurrent Requests');
            log('Expected: Dedupe stability, no memory leaks, proper circuit breaker behavior');
            
            const initialMemory = getMemoryStats();
            if (initialMemory) {
                log(`   Initial memory: ${initialMemory.used}MB / ${initialMemory.total}MB`, 'info');
            }
            
            try {
                const startTime = Date.now();
                
                // Fire 50 concurrent requests to test dedupe stability
                const promises = [];
                for (let i = 0; i < 50; i++) {
                    promises.push(fetch('/api/test-retry', {
                        headers: { 'X-Test-Fail-Rate': '0.1' } // 10% failure rate
                    }));
                }
                
                log('   🚀 Fired 50 concurrent requests...', 'info');
                
                const responses = await Promise.allSettled(promises);
                const endTime = Date.now();
                
                const finalMemory = getMemoryStats();
                if (finalMemory) {
                    log(`   Final memory: ${finalMemory.used}MB / ${finalMemory.total}MB`, 'info');
                    const memoryIncrease = finalMemory.used - initialMemory.used;
                    log(`   Memory increase: ${memoryIncrease}MB`, memoryIncrease > 10 ? 'warning' : 'pass');
                }
                
                log(`✅ Burst test completed:`, 'pass');
                log(`   - Total time: ${endTime - startTime}ms`, 'info');
                log(`   - Requests: ${responses.length}`, 'info');
                
                // Analyze results
                const successful = responses.filter(r => r.status === 'fulfilled').length;
                const failed = responses.filter(r => r.status === 'rejected').length;
                
                log(`   - Successful: ${successful}`, 'pass');
                log(`   - Failed: ${failed}`, failed > 0 ? 'warning' : 'pass');
                
                // Check for reasonable performance
                if (endTime - startTime < 10000) { // Less than 10 seconds
                    log('   - ✅ Performance acceptable', 'pass');
                } else {
                    log('   - ⚠️ Performance degraded', 'warning');
                }
                
            } catch (error) {
                log(`❌ Burst test failed: ${error.message}`, 'fail');
            }
            log('---');
        }

        // Test 2: Circuit Breaker Under Burst Load
        async function testCircuitBreakerBurst() {
            log('🔥 Test 2: Circuit Breaker Under Burst Load');
            log('Expected: Circuit breaker handles burst without flipping incorrectly');
            
            try {
                const startTime = Date.now();
                
                // Fire 20 requests that will fail to trigger circuit breaker
                const failurePromises = Array(20).fill(null).map(() =>
                    fetch('/api/test-logging', {
                        headers: { 'X-Force-Error': 'CIRCUIT_BREAKER_BURST' }
                    })
                );
                
                const failureResults = await Promise.allSettled(failurePromises);
                const failures = failureResults.filter(r => r.status === 'rejected').length;
                
                log(`   - Forced failures: ${failures}`, 'info');
                
                // Now test if circuit breaker responds correctly
                const testAfterBurst = await fetch('/api/test-retry');
                
                if (testAfterBurst.ok) {
                    log('✅ Circuit breaker handled burst correctly', 'pass');
                } else {
                    log('⚠️ Circuit breaker may be OPEN (expected under burst)', 'warning');
                }
                
                const endTime = Date.now();
                log(`   - Burst test time: ${endTime - startTime}ms`, 'info');
                
            } catch (error) {
                log(`❌ Circuit breaker burst test failed: ${error.message}`, 'fail');
            }
            log('---');
        }

        // Test 3: Memory Leak Detection
        async function testMemoryLeaks() {
            log('🔥 Test 3: Memory Leak Detection');
            log('Expected: No growing memory usage over multiple bursts');
            
            const memorySnapshots = [];
            
            try {
                // Run 3 burst cycles and monitor memory
                for (let cycle = 0; cycle < 3; cycle++) {
                    log(`   Running burst cycle ${cycle + 1}...`, 'info');
                    
                    const beforeMemory = getMemoryStats();
                    if (beforeMemory) {
                        memorySnapshots.push(beforeMemory.used);
                    }
                    
                    // Small burst
                    const promises = Array(10).fill(null).map(() =>
                        fetch('/api/test-retry', {
                            headers: { 'X-Test-Fail-Rate': '0.2' }
                        })
                    );
                    
                    await Promise.allSettled(promises);
                    
                    // Force garbage collection if available
                    if (window.gc) {
                        window.gc();
                    }
                    
                    await new Promise(resolve => setTimeout(resolve, 100)); // Small delay
                }
                
                // Analyze memory trend
                if (memorySnapshots.length === 3) {
                    const memoryIncrease = memorySnapshots[2] - memorySnapshots[0];
                    log(`   Memory trend: ${memorySnapshots[0]}MB → ${memorySnapshots[2]}MB`, 'info');
                    log(`   Total increase: ${memoryIncrease}MB`, memoryIncrease > 5 ? 'warning' : 'pass');
                    
                    if (memoryIncrease < 5) {
                        log('✅ No significant memory leaks detected', 'pass');
                    } else {
                        log('⚠️ Possible memory leak detected', 'warning');
                    }
                }
                
            } catch (error) {
                log(`❌ Memory leak test failed: ${error.message}`, 'fail');
            }
            log('---');
        }

        // Test 4: Deduplication Edge Cases
        async function testDeduplicationEdgeCases() {
            log('🔥 Test 4: Deduplication Edge Cases');
            log('Expected: Deduplication works correctly under mixed scenarios');
            
            try {
                const startTime = Date.now();
                
                // Mix of different endpoints to test deduplication isolation
                const promises = [
                    // Same endpoint - should dedupe
                    fetch('/api/test-zod'),
                    fetch('/api/test-zod'),
                    fetch('/api/test-zod'),
                    // Different endpoints - should not dedupe
                    fetch('/api/test-normalization', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ data: { name: 'test' } })
                    }),
                    fetch('/api/test-logging'),
                    // Same endpoint again - should dedupe
                    fetch('/api/test-zod')
                ];
                
                const responses = await Promise.allSettled(promises);
                const endTime = Date.now();
                
                log(`✅ Deduplication edge cases test completed:`, 'pass');
                log(`   - Total time: ${endTime - startTime}ms`, 'info');
                log(`   - Requests: ${responses.length}`, 'info');
                
                const successful = responses.filter(r => r.status === 'fulfilled').length;
                log(`   - Successful: ${successful}`, 'pass');
                
                // If deduplication is working, this should complete quickly
                if (endTime - startTime < 5000) {
                    log('   - ✅ Deduplication working efficiently', 'pass');
                } else {
                    log('   - ⚠️ Deduplication may not be working optimally', 'warning');
                }
                
            } catch (error) {
                log(`❌ Deduplication edge cases test failed: ${error.message}`, 'fail');
            }
            log('---');
        }

        // Run all burst tests
        async function runBurstTests() {
            log('🚀 Starting Burst Tests - Emergent Behavior Testing\n');
            log('💀 This tests real-world concurrency behavior, not simulated failures\n');
            
            await testBurstRequests();
            await testCircuitBreakerBurst();
            await testMemoryLeaks();
            await testDeduplicationEdgeCases();
            
            log('🏁 Burst Tests Complete!');
            log('\n💬 Real Talk:');
            log('- These tests reveal emergent behavior under real load');
            log('- Memory leaks and race conditions only show up here');
            log('- Your system is now tested for production-grade concurrency');
            log('\n🎯 Ready for React Query integration');
        }

        // Run burst tests when page loads
        runBurstTests().catch(console.error);
    </script>
</body>
</html>
