<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production API Tests</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #00ff00; }
        .test { margin: 20px 0; padding: 10px; border: 1px solid #333; }
        .pass { color: #00ff00; }
        .fail { color: #ff0000; }
        .info { color: #ffff00; }
        pre { background: #000; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🧪 Production API Pressure Tests</h1>
    <div id="results"></div>

    <script type="module">
        // Simple test harness for production API testing
        const results = document.getElementById('results');
        
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test ${type}`;
            div.innerHTML = `<pre>${message}</pre>`;
            results.appendChild(div);
        }

        // Test 1: Retry Logic
        async function testRetry() {
            log('🔥 Test 1: Retry Logic with Network Chaos');
            log('Expected: First request fails → retry kicks in → second succeeds');
            
            try {
                const response = await fetch('/api/test-retry', {
                    headers: { 'X-Test-Fail-Rate': '0.5' }
                });
                const data = await response.json();
                
                if (data.success) {
                    log('✅ Retry test passed - got response', 'pass');
                    log(JSON.stringify(data, null, 2), 'pass');
                } else {
                    log('❌ Retry test failed - no success response', 'fail');
                }
            } catch (error) {
                log(`❌ Retry test failed: ${error.message}`, 'fail');
            }
            log('---');
        }

        // Test 2: Auth Refresh
        async function testAuth() {
            log('🔥 Test 2: Auth Refresh with 401 Simulation');
            log('Expected: Request → 401 → refreshToken → retry → success');
            
            try {
                const response = await fetch('/api/test-auth', {
                    headers: { 'X-Force-401': 'true' }
                });
                
                if (response.status === 401) {
                    log('✅ Auth refresh test passed - got expected 401', 'pass');
                } else {
                    log(`❌ Auth refresh test failed - got status ${response.status}`, 'fail');
                }
            } catch (error) {
                log(`❌ Auth refresh test failed: ${error.message}`, 'fail');
            }
            log('---');
        }

        // Test 3: Deduplication
        async function testDeduplication() {
            log('🔥 Test 3: Request Deduplication');
            log('Expected: Multiple simultaneous calls should be deduplicated');
            
            try {
                const startTime = Date.now();
                
                // Fire multiple requests simultaneously
                const promises = [
                    fetch('/api/users'),
                    fetch('/api/users'),
                    fetch('/api/users')
                ];
                
                const responses = await Promise.all(promises);
                const endTime = Date.now();
                
                log(`✅ Deduplication test completed:`, 'pass');
                log(`   - Got ${responses.length} responses`, 'pass');
                log(`   - Total time: ${endTime - startTime}ms`, 'pass');
                log(`   - Should be ~1 request time, not 3x`, 'info');
            } catch (error) {
                log(`❌ Deduplication test failed: ${error.message}`, 'fail');
            }
            log('---');
        }

        // Test 4: Response Normalization
        async function testNormalization() {
            log('🔥 Test 4: Response Normalization');
            log('Expected: Different backend shapes → consistent frontend response');
            
            const testCases = [
                { shape: { data: { name: 'yassin' } }, expected: 'yassin' },
                { shape: { result: { name: 'yassin' } }, expected: 'yassin' },
                { shape: { user: { name: 'yassin' } }, expected: 'yassin' },
                { shape: { name: 'yassin' }, expected: 'yassin' }
            ];
            
            for (const testCase of testCases) {
                try {
                    const response = await fetch('/api/test-normalization', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(testCase.shape)
                    });
                    
                    const data = await response.json();
                    
                    // Check if our normalizeResponse function would work
                    const normalized = data?.data || data?.result || data?.user || data;
                    
                    if (normalized?.name === testCase.expected) {
                        log(`✅ Normalization passed for ${JSON.stringify(testCase.shape)}`, 'pass');
                    } else {
                        log(`❌ Normalization failed for ${JSON.stringify(testCase.shape)}`, 'fail');
                        log(`   Expected: ${testCase.expected}, Got: ${normalized?.name}`, 'fail');
                    }
                } catch (error) {
                    log(`❌ Normalization error for ${JSON.stringify(testCase.shape)}: ${error.message}`, 'fail');
                }
            }
            log('---');
        }

        // Test 5: Zod Validation
        async function testZod() {
            log('🔥 Test 5: Zod Validation Failure');
            log('Expected: Malformed response should be caught by validation');
            
            try {
                const response = await fetch('/api/test-zod');
                const data = await response.json();
                
                // Simulate Zod validation
                if (!data.name || typeof data.name !== 'string') {
                    log('✅ Zod validation correctly caught malformed response', 'pass');
                    log(`   Missing/invalid name field in: ${JSON.stringify(data)}`, 'info');
                } else {
                    log('❌ Zod test failed - should have caught validation error', 'fail');
                }
            } catch (error) {
                log(`❌ Zod test failed with unexpected error: ${error.message}`, 'fail');
            }
            log('---');
        }

        // Test 6: Observability
        async function testObservability() {
            log('🔥 Test 6: Observability Logging');
            log('Expected: Error should be logged with proper details');
            
            try {
                const response = await fetch('/api/test-logging', {
                    headers: { 'X-Force-Error': 'TEST ERROR' }
                });
                
                // Should get 500 error
                if (response.status === 500) {
                    log('✅ Observability test passed - error was properly handled', 'pass');
                } else {
                    log(`❌ Observability test failed - got status ${response.status}`, 'fail');
                }
            } catch (error) {
                log(`✅ Observability test passed - error caught: ${error.message}`, 'pass');
            }
            log('---');
        }

        // Run all tests
        async function runAllTests() {
            log('🚀 Starting Production API Pressure Tests...\n');
            
            await testRetry();
            await testAuth();
            await testDeduplication();
            await testNormalization();
            await testZod();
            await testObservability();
            
            log('🏁 Production API Tests Complete!');
            log('\n💬 Real Talk:');
            log('- If all tests pass → system is production-hardened');
            log('- If any test fails → fix before going to production');
            log('- These tests simulate real-world failure scenarios');
        }

        // Run tests when page loads
        runAllTests().catch(console.error);
    </script>
</body>
</html>
