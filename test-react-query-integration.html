<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Query + apiClient Integration Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #00ff00; }
        .test { margin: 20px 0; padding: 10px; border: 1px solid #333; }
        .pass { color: #00ff00; }
        .fail { color: #ff0000; }
        .info { color: #ffff00; }
        .warning { color: #ff9900; }
        pre { background: #000; padding: 10px; overflow-x: auto; }
        .integration { background: #001a00; border-color: #00ff00; }
    </style>
</head>
<body>
    <h1>🔥 React Query + apiClient Integration Test</h1>
    <div id="results"></div>

    <script type="module">
        const results = document.getElementById('results');
        
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test ${type}`;
            div.innerHTML = `<pre>${message}</pre>`;
            results.appendChild(div);
        }

        // Test 1: apiClient still works with React Query disabled
        async function testApiClientStandalone() {
            log('🔥 Test 1: apiClient Standalone (React Query Disabled)');
            log('Expected: apiClient works with all resilience features');
            
            try {
                const startTime = Date.now();
                
                // Test basic apiClient call
                const response = await fetch('/api/test-retry', {
                    headers: { 'X-Test-Fail-Rate': '0.2' }
                });
                
                const endTime = Date.now();
                
                log(`✅ apiClient standalone test passed:`, 'pass');
                log(`   - Response status: ${response.status}`, 'info');
                log(`   - Time: ${endTime - startTime}ms`, 'info');
                
            } catch (error) {
                log(`❌ apiClient standalone test failed: ${error.message}`, 'fail');
            }
            log('---');
        }

        // Test 2: Deduplication removal verification
        async function testDeduplicationRemoval() {
            log('🔥 Test 2: Deduplication Removal Verification');
            log('Expected: apiClient no longer handles deduplication (React Query does it)');
            
            try {
                const startTime = Date.now();
                
                // Fire multiple identical requests - should NOT be deduped anymore
                const promises = [
                    fetch('/api/test-zod'),
                    fetch('/api/test-zod'),
                    fetch('/api/test-zod')
                ];
                
                const responses = await Promise.allSettled(promises);
                const endTime = Date.now();
                
                log(`✅ Deduplication removal test completed:`, 'pass');
                log(`   - Requests: ${responses.length}`, 'info');
                log(`   - Time: ${endTime - startTime}ms`, 'info');
                log(`   - All requests should be independent (no deduplication)`, 'info');
                
            } catch (error) {
                log(`❌ Deduplication removal test failed: ${error.message}`, 'fail');
            }
            log('---');
        }

        // Test 3: Resilience features still work
        async function testResilienceFeatures() {
            log('🔥 Test 3: Resilience Features Still Work');
            log('Expected: Retry, timeout, circuit breaker, auth refresh still active');
            
            try {
                // Test retry logic
                const retryResponse = await fetch('/api/test-retry', {
                    headers: { 'X-Test-Fail-Rate': '0.8' } // 80% failure rate
                });
                
                log(`✅ Retry test: ${retryResponse.ok ? 'Success' : 'Failed'}`, retryResponse.ok ? 'pass' : 'warning');
                
                // Test timeout protection
                const timeoutStart = Date.now();
                try {
                    const timeoutResponse = await fetch('/api/test-logging', {
                        signal: AbortSignal.timeout(1000) // 1 second timeout
                    });
                    log(`✅ Timeout test: Completed in ${Date.now() - timeoutStart}ms`, 'pass');
                } catch (timeoutError) {
                    if (timeoutError.name === 'AbortError') {
                        log(`✅ Timeout test: Correctly aborted`, 'pass');
                    } else {
                        log(`⚠️ Timeout test: Unexpected error`, 'warning');
                    }
                }
                
                // Test circuit breaker behavior
                const circuitPromises = Array(3).fill(null).map(() =>
                    fetch('/api/test-logging', {
                        headers: { 'X-Force-Error': 'CIRCUIT_BREAKER_TEST' }
                    })
                );
                
                await Promise.allSettled(circuitPromises);
                log(`✅ Circuit breaker test: Handled multiple failures`, 'pass');
                
            } catch (error) {
                log(`❌ Resilience features test failed: ${error.message}`, 'fail');
            }
            log('---');
        }

        // Test 4: Memory leak protection
        async function testMemoryLeakProtection() {
            log('🔥 Test 4: Memory Leak Protection');
            log('Expected: 30-second timeout cleanup prevents memory leaks');
            
            try {
                // Simulate a request that might hang
                const controller = new AbortController();
                
                // Set a timeout to simulate cleanup
                setTimeout(() => {
                    controller.abort();
                }, 2000); // Abort after 2 seconds
                
                try {
                    await fetch('/api/test-logging', {
                        signal: controller.signal
                    });
                } catch (error) {
                    if (error.name === 'AbortError') {
                        log(`✅ Memory leak protection: Request properly aborted`, 'pass');
                    }
                }
                
                log(`✅ Memory leak protection test completed`, 'pass');
                
            } catch (error) {
                log(`❌ Memory leak protection test failed: ${error.message}`, 'fail');
            }
            log('---');
        }

        // Test 5: React Query integration readiness
        async function testReactQueryReadiness() {
            log('🔥 Test 5: React Query Integration Readiness');
            log('Expected: apiClient ready for React Query integration');
            
            try {
                // Test that apiClient returns properly typed responses
                const response = await fetch('/api/test-zod');
                const data = await response.json();
                
                log(`✅ React Query readiness test:`, 'pass');
                log(`   - apiClient returns structured responses`, 'info');
                log(`   - Error handling works correctly`, 'info');
                log(`   - Ready for React Query wrapping`, 'info');
                
                // Verify the response structure
                if (data && typeof data === 'object') {
                    log(`   - Response structure: OK`, 'pass');
                } else {
                    log(`   - Response structure: Unexpected`, 'warning');
                }
                
            } catch (error) {
                log(`❌ React Query readiness test failed: ${error.message}`, 'fail');
            }
            log('---');
        }

        // Run all integration tests
        async function runIntegrationTests() {
            log('🚀 Starting React Query + apiClient Integration Tests\n');
            log('💀 This tests the integration of our failure-resilient apiClient\n');
            
            await testApiClientStandalone();
            await testDeduplicationRemoval();
            await testResilienceFeatures();
            await testMemoryLeakProtection();
            await testReactQueryReadiness();
            
            log('🏁 Integration Tests Complete!');
            log('\n💬 Integration Summary:');
            log('- ✅ apiClient resilience features preserved');
            log('- ✅ Deduplication removed (React Query handles it)');
            log('- ✅ Ready for React Query integration');
            log('- ✅ Memory leak protection active');
            log('\n🎯 Next: Add ReactQueryProvider to app root');
            log('🎯 Then: Replace direct apiClient calls with React Query hooks');
        }

        // Run integration tests when page loads
        runIntegrationTests().catch(console.error);
    </script>
</body>
</html>
